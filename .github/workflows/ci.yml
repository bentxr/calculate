name: ci

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# A newer commit on the same branch makes a running build obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: Configure, build, test
        run: cmake --preset desktop-ci && cmake --build --preset desktop-ci && ctest --preset desktop-ci

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.2'
          host: all_os
          target: wasm
          arch: wasm_multithread
          modules: ''
          autodesktop: true
          cache: true
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build for the browser
        run: |
          export QT_WASM="$QT_ROOT_DIR"
          export QT_HOST="$(dirname "$QT_ROOT_DIR")/gcc_64"
          ls "$QT_HOST/bin/qmake"
          cmake --preset wasm-ci && cmake --build --preset wasm-ci
